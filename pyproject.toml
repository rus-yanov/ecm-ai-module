[project]
name = "ecm-ai-module"
version = "0.1.0"
description = "Intelligent document processing module for ECM system"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "pypdfium2>=4.30",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "structlog>=25.1",
    "paddlepaddle>=3.3.1",
    "paddleocr>=3.5.0",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
